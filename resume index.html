  <script>
    document.getElementById('ratingForm').onsubmit = function(event) {
      event.preventDefault();
      const ratings = document.getElementsByName('rating');
      let selectedRating = null;
      for (const radio of ratings) {
        if (radio.checked) {
          selectedRating = parseInt(radio.value);
          break;
        }
      }

      if (selectedRating >= 1 && selectedRating <= 5) {
        let emoji = "❓";
        if (selectedRating === 1) emoji = "😞";
        else if (selectedRating === 2) emoji = "😐";
        else if (selectedRating === 3) emoji = "🙂";
        else if (selectedRating === 4) emoji = "😃";
        else if (selectedRating === 5) emoji = "👏";

        document.getElementById("resume-page").style.display = "none";
        document.getElementById("thankyou-page").style.display = "block";
        document.getElementById("emoji").textContent = emoji;
      } else {
        document.getElementById('emoji-output').textContent = "Please select a rating from 1 to 5.";
      }
    };

    function goBack() {
      document.getElementById("thankyou-page").style.display = "none";
      document.getElementById("resume-page").style.display = "block";
      const ratings = document.getElementsByName('rating');
      ratings.forEach(r => r.checked = false);
      document.getElementById("emoji-output").textContent = "";
    }
  </script>
